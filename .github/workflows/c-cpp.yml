name: Linux Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev liblua5.4-dev
        version: 1.0

    - name: link lua
      run: |
        # Ubuntu only ships liblua5.4.so, but the Makefile links with -llua
        sudo ln -sf /usr/lib/x86_64-linux-gnu/liblua5.4.so /usr/lib/x86_64-linux-gnu/liblua.so

    - name: build
      run: make build
      env:
        # Ubuntu puts Lua headers in a versioned directory
        CPATH: /usr/include/lua5.4
